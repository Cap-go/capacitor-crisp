# Org policy: Cap-go workflows use latest major action tags (no SHA pins) and
# example-app deploys run the latest first-party @capgo/cli on purpose.
# Ignore only those two rules, only in workflow files.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/**
sonar.issue.ignore.multicriteria.e2.ruleKey=githubactions:S8543
sonar.issue.ignore.multicriteria.e2.resourceKey=.github/workflows/**
